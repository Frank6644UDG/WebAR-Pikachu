<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de experiencias</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#f4f5f7;color:#1b1e26;display:flex;min-height:100vh}
  aside{width:240px;background:#1b1e26;color:#fff;padding:16px;flex-shrink:0}
  aside h2{margin:0 0 12px;font-size:1rem}
  aside button{width:100%;text-align:left;margin-bottom:6px;padding:10px;border:0;border-radius:8px;background:#2a2f3b;color:#fff;cursor:pointer}
  aside button.on{background:#ff4d6d}
  main{flex:1;padding:24px;min-width:0}
  fieldset{border:1px solid #d8dbe2;border-radius:12px;background:#fff;margin:0 0 16px;padding:16px}
  legend{font-weight:700;padding:0 6px}
  label{display:block;margin:10px 0 4px;font-size:.85rem;font-weight:600}
  input[type=text],input[type=number],textarea,select{width:100%;padding:9px;border:1px solid #c9ced8;border-radius:8px;font:inherit}
  textarea{min-height:110px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .el{border:1px solid #d8dbe2;border-left:5px solid #ff4d6d;border-radius:10px;padding:12px;margin:12px 0;background:#fafbfc}
  .elh{display:flex;gap:10px;align-items:center;justify-content:space-between}
  .elh select{width:auto}
  .elh button,.tabs button,.add button,#pvChips button{padding:6px 12px;border:1px solid #c9ced8;background:#fff;border-radius:8px;cursor:pointer;margin-left:4px}
  .tabs button.on,#pvChips button.on{background:#1b1e26;color:#fff}
  .add{margin-top:8px}.add button{margin:0 6px 0 0}
  .primary{background:#ff4d6d;color:#fff;border:0;padding:12px 22px;border-radius:10px;font-weight:700;cursor:pointer}
  .danger{background:#fff;color:#c0243f;border:1px solid #c0243f;padding:12px 18px;border-radius:10px;cursor:pointer;margin-left:8px}
  small{color:#6b7280;display:block;margin-top:4px;word-break:break-all}
  #status{margin-left:12px;font-weight:600}
  a{color:#ff4d6d}
  .qrbox{background:#fff;border:1px dashed #c9ced8;border-radius:10px;padding:14px;margin-top:12px;text-align:center}
  .qrbox svg{width:100%;max-width:280px;height:auto}
  /* Vista previa en teléfono (pantalla real de 360x720 reducida al 60 %) */
  #phoneCol{width:290px;padding:24px 12px;position:sticky;top:0;align-self:flex-start;flex-shrink:0}
  #phoneCol h3{margin:0 0 8px;text-align:center}
  #pvChips{text-align:center;margin-bottom:10px}
  .phoneWrap{padding:10px;background:#111;border-radius:36px;width:236px;margin:0 auto}
  .phone{width:216px;height:432px;overflow:hidden;border-radius:26px;position:relative;background:#333}
  .pvscreen{width:360px;height:720px;transform:scale(.6);transform-origin:0 0;position:relative;color:#fff;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:linear-gradient(#4a4f5c,#2b2e37)}
  .pvimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .pvlabel{position:absolute;top:50%;left:0;right:0;text-align:center;opacity:.7}
  .pvpanel{position:absolute;left:12px;right:12px;bottom:14px;background:#000c;border-radius:18px;padding:16px}
  .pvpanel h2{margin:0 0 8px;font-size:1.1rem}
  .pvbody{max-height:187px;overflow:hidden;line-height:1.5;white-space:pre-line;font-size:16px}
  .pvrow{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
  .pvb{padding:10px 16px;border-radius:14px;background:#ff4d6d;font-size:14.4px;font-weight:600}
  .pvb.g{background:transparent;border:1.5px solid #fff6}
  .pvfloat{position:absolute;left:50%;transform:translateX(-50%);bottom:24px}
  .pvsound{position:absolute;top:12px;left:12px;background:#000a;border:1.5px solid #fff6}
  .pvaim{position:absolute;left:0;right:0;top:62%;text-align:center}
  .pvaim span{background:#000a;padding:8px 14px;border-radius:999px}
  .layers{margin-top:12px;padding-top:8px;border-top:1px dashed #c9ced8}
  .layer{border:1px solid #e1e4ea;border-left:4px solid #6c8cff;border-radius:8px;padding:10px;margin:10px 0;background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:900px){body{flex-direction:column}aside{width:100%}#phoneCol{position:static;width:100%}}
</style>
</head>
<body>
<aside>
  <h2>Experiencias</h2>
  <div id="list"></div>
  <button id="btnNew">＋ Nueva experiencia</button>
</aside>
<main id="main"></main>
<div id="phoneCol">
  <h3>Vista previa</h3>
  <div id="pvChips"></div>
  <div id="pvTime" style="text-align:center;margin-bottom:8px"></div>
  <div class="phoneWrap"><div class="phone"><div class="pvscreen" id="pvScreen"></div></div></div>
  <small style="text-align:center">Así se ve en un teléfono, con el idioma de la pestaña elegida. Toca un elemento para verlo.</small>
</div>

<script>
const LANGS = { es:'Español', en:'English', ja:'日本語', zh:'中文', ko:'한국어' };
const TYPES = { video:'Video', image:'Imagen / animación WebP', text:'Texto (paso aparte)' };
const PV = {
  es:{more:'Leer más',next:'Siguiente',close:'Cerrar',aim:'Enfoca la silueta',mute:'Silenciar'},
  en:{more:'Read more',next:'Next',close:'Close',aim:'Aim at the outline',mute:'Mute'},
  ja:{more:'続きを読む',next:'次へ',close:'閉じる',aim:'シルエットに合わせてください',mute:'ミュート'},
  zh:{more:'阅读更多',next:'下一步',close:'关闭',aim:'请对准轮廓',mute:'静音'},
  ko:{more:'더 보기',next:'다음',close:'닫기',aim:'실루엣에 맞춰 주세요',mute:'음소거'}
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let all = [], cur = null, tab = 'es', pv = 0, qrLast = null;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function refresh(selectId) {
  all = await api('/api/experiences');
  cur = all.find(e => e.id === selectId) || (cur && all.find(e => e.id === cur.id)) || all[0] || null;
  render();
}
const blank = () => ({ name:'Nueva experiencia', targetSrc:'', silhouetteSrc:'', elements:[] });
const status = (m) => { if ($('#status')) $('#status').textContent = m; };

function fileField(k, label, accept) {
  return `<label>${label}</label><input type="file" data-k="${k}" accept="${accept}"><small>${esc(cur[k]) || 'Sin archivo'}</small>`;
}
function elHtml(el, i) {
  const tx = (el.texts && el.texts[tab]) || { title:'', body:'' };
  const fi = (f, acc) => `<input type="file" data-el="${i}" data-f="${f}" accept="${acc}"><small>${esc(el[f]) || 'Sin archivo'}</small>`;
  const body = el.type === 'text'
    ? `<label>Título (${LANGS[tab]})</label><input type="text" data-ti="${i}" value="${esc(tx.title)}">
       <label>Texto (${LANGS[tab]})</label><textarea data-tb="${i}">${esc(tx.body)}</textarea>`
    : el.type === 'video'
      ? `<label>Video principal (.mov con transparencia para iPhone, o .mp4)</label>${fi('src','.mov,video/quicktime,video/mp4,video/webm')}
         <label>Video alternativo (.webm con transparencia para Android y Chrome) - opcional</label>${fi('srcAlt','.webm,video/webm')}`
      : `<label>Imagen o animación (.webp animado, .png, .jpg, .gif)</label>${fi('src','image/*')}
         <label>Audio (opcional, .mp3 o .m4a). El visitante podrá silenciarlo.</label>${fi('audioSrc','audio/*,.mp3,.m4a,.ogg')}`;
  const layers = el.type === 'text' ? '' : layersHtml(el, i);
  return `<div class="el"><div class="elh"><b>Elemento ${i+1}</b>
    <select data-type="${i}">${Object.entries(TYPES).map(([k,v]) => `<option value="${k}" ${el.type===k?'selected':''}>${v}</option>`).join('')}</select>
    <span><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button data-del="${i}">✕</button></span></div>${body}${layers}</div>`;
}
function qrHtml() {
  if (!cur.id) return '<fieldset><legend>Código QR para plantilla (stencil)</legend><p>Guarda la experiencia para poder generar su QR.</p></fieldset>';
  return `<fieldset><legend>Código QR para plantilla (stencil)</legend>
    <small>QR del enlace público, con puentes para que la plantilla no se desarme al cortarla. Es la zona de pintura: los cuadros negros son huecos.</small>
    <div class="grid">
      <div><label>Tamaño del QR (cm)</label><input type="number" id="q_size" value="40" min="5" max="300"></div>
      <div><label>Ancho de puentes (% del módulo)</label><input type="number" id="q_bridge" value="30" min="15" max="50"></div>
      <div><label>Corrección de errores</label><select id="q_ecc"><option value="H">Alta (H) - recomendada</option><option value="Q">Media-alta (Q) - QR más simple</option></select></div>
    </div>
    <p><button class="primary" id="btnQR">Generar QR</button></p><div id="qrOut"></div></fieldset>`;
}
function render() {
  $('#list').innerHTML = all.map(e => `<button class="${cur && cur.id===e.id?'on':''}" data-id="${e.id}">${esc(e.name)}</button>`).join('');
  document.querySelectorAll('#list button').forEach(b => b.onclick = () => { cur = all.find(e => e.id === b.dataset.id); pv = 0; render(); });
  if (!cur) { $('#main').innerHTML = '<p>Crea tu primera experiencia con el botón de la izquierda.</p>'; $('#pvScreen').innerHTML = ''; return; }
  const link = cur.id ? `${location.origin}/?e=${cur.id}` : '';
  $('#main').innerHTML = `
    <h1>Editor</h1>
    ${link ? `<p>Enlace público: <a href="${link}" target="_blank">${link}</a></p>` : '<p>Guarda para obtener el enlace público.</p>'}
    <fieldset><legend>General</legend>
      <label>Nombre (solo para ti)</label><input type="text" id="f_name" value="${esc(cur.name)}">
      ${fileField('targetSrc','Imagen objetivo compilada (.mind): dispara la experiencia','.mind')}
      ${fileField('silhouetteSrc','Silueta guía (PNG con fondo transparente)','image/png,image/webp,image/jpeg')}
    </fieldset>
    <fieldset><legend>Elementos (se muestran a pantalla completa, en orden)</legend>
      <div class="tabs">Idioma de los textos: ${Object.entries(LANGS).map(([k,v]) => `<button data-t="${k}" class="${k===tab?'on':''}">${v}</button>`).join('')}</div>
      ${cur.elements.map(elHtml).join('') || '<p>Aún no hay elementos.</p>'}
      <div class="add"><button data-add="video">＋ Video</button><button data-add="image">＋ Imagen / animación</button><button data-add="text">＋ Texto</button></div>
    </fieldset>
    <button class="primary" id="btnSave">Guardar</button>
    ${cur.id ? '<button class="danger" id="btnDel">Eliminar</button>' : ''}<span id="status"></span>
    <div style="height:20px"></div>${qrHtml()}`;

  const on = (sel, fn) => document.querySelectorAll(sel).forEach(n => n.onclick = (ev) => { ev.stopPropagation(); sync(); fn(n); render(); });
  on('.tabs button', n => tab = n.dataset.t);
  on('[data-add]', n => { cur.elements.push({ type:n.dataset.add, src:'', texts:{} }); pv = cur.elements.length - 1; });
  on('[data-del]', n => cur.elements.splice(+n.dataset.del, 1));
  on('[data-up]', n => { const i=+n.dataset.up; if (i>0) { [cur.elements[i-1],cur.elements[i]]=[cur.elements[i],cur.elements[i-1]]; pv=i-1; } });
  on('[data-down]', n => { const i=+n.dataset.down, e=cur.elements; if (i<e.length-1) { [e[i+1],e[i]]=[e[i],e[i+1]]; pv=i+1; } });
  on('[data-addlayer]', n => { const e = cur.elements[+n.dataset.addlayer]; e.layers = (e.layers || []).concat({ start:0, duration:0, texts:{} }); pv = +n.dataset.addlayer; });
  on('[data-dellayer]', n => { const [i, j] = n.dataset.dellayer.split('.').map(Number); cur.elements[i].layers.splice(j, 1); pv = i; });
  document.querySelectorAll('[data-ls],[data-ld],[data-lt],[data-lb],[data-dur]').forEach(inp => {
    const key = () => inp.dataset.ls || inp.dataset.ld || inp.dataset.lt || inp.dataset.lb || inp.dataset.dur;
    inp.oninput = () => {
      sync();
      const k = key(), w = document.querySelector(`[data-warn="${k}"]`);
      if (w) { const [i, j] = k.split('.').map(Number); w.innerHTML = warnHtml(cur.elements[i].layers[j]); }
      renderPreview();
    };
    inp.onfocus = () => { pv = parseInt(key()); renderPreview(); };
  });
  document.querySelectorAll('[data-type]').forEach(s => s.onchange = () => { sync(); cur.elements[+s.dataset.type].type = s.value; render(); });
  document.querySelectorAll('.el').forEach((d, i) => d.addEventListener('click', () => { pv = i; renderPreview(); }));
  document.querySelectorAll('[data-ti],[data-tb]').forEach(inp => {
    inp.oninput = () => { sync(); renderPreview(); };
    inp.onfocus = () => { pv = +(inp.dataset.ti ?? inp.dataset.tb); renderPreview(); };
  });
  document.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    if (!inp.files[0]) return;
    sync(); status('Subiendo…');
    try {
      const fd = new FormData(); fd.append('file', inp.files[0]);
      const { url } = await api('/api/upload', { method:'POST', body: fd });
      if (inp.dataset.k) cur[inp.dataset.k] = url; else cur.elements[+inp.dataset.el][inp.dataset.f || 'src'] = url;
      render(); status('Archivo subido. Falta guardar.');
    } catch (e) { status('Error: ' + e.message); }
  });
  $('#btnSave').onclick = save;
  if ($('#btnDel')) $('#btnDel').onclick = async () => {
    if (!confirm('¿Eliminar esta experiencia?')) return;
    await api('/api/experiences/' + cur.id, { method:'DELETE' }); cur = null; refresh();
  };
  if ($('#btnQR')) $('#btnQR').onclick = genQR;
  if (qrLast && qrLast.id === cur.id && $('#qrOut')) $('#qrOut').innerHTML = qrLast.html;
  renderPreview();
}

// ---- Vista previa en teléfono
function media(el) {
  if (!el) return '';
  if (el.type === 'image') return el.src ? `<img class="pvimg" src="${esc(el.src)}" alt="">` : '<div class="pvlabel">Imagen</div>';
  if (el.type === 'video') {
    const vs = [el.srcAlt, el.src].find(u => u && !/\.mov$/i.test(u));
    return (vs ? `<video class="pvimg" src="${esc(vs)}" muted playsinline preload="metadata"></video>` : '') + '<div class="pvlabel">▶ Video</div>';
  }
  return '';
}
const CPS = { es:17, en:17, ja:8, zh:9, ko:9 };   // caracteres que se leen por segundo (guía aproximada)
let pvT = 0;
function warnHtml(l) {
  if (!l || !(l.duration > 0)) return '';
  const bad = Object.keys(LANGS).map(k => {
    const t = (l.texts && l.texts[k]) || {}, n = (t.title || '').length + (t.body || '').length, need = Math.ceil(n / CPS[k]);
    return need > l.duration ? `${LANGS[k]} ≥ ${need} s` : '';
  }).filter(Boolean);
  return bad.length ? `<small style="color:#b45309">⚠ Texto largo para esta duración (guía aproximada de lectura): ${bad.join(', ')}</small>` : '';
}
function layerHtml(l, i, j) {
  const tx = (l.texts && l.texts[tab]) || { title:'', body:'' }, k = `${i}.${j}`;
  return `<div class="layer"><div class="elh"><b>Capa ${j+1}</b><button data-dellayer="${k}">✕</button></div>
    <div class="grid2">
      <div><label>Aparece en el segundo</label><input type="number" min="0" step="0.5" data-ls="${k}" value="${l.start || 0}"></div>
      <div><label>Dura (s) · 0 = hasta que termina la escena</label><input type="number" min="0" step="0.5" data-ld="${k}" value="${l.duration || 0}"></div>
    </div>
    <label>Título (${LANGS[tab]})</label><input type="text" data-lt="${k}" value="${esc(tx.title)}">
    <label>Texto (${LANGS[tab]})</label><textarea data-lb="${k}">${esc(tx.body)}</textarea>
    <div data-warn="${k}">${warnHtml(l)}</div></div>`;
}
function layersHtml(el, i) {
  return `<div class="layers"><b>Capas de texto</b> <small>aparecen sobre la escena, en el segundo que indiques</small>
    ${el.type === 'image' ? `<label>Duración de la escena (s) · 0 = espera el botón Siguiente</label><input type="number" min="0" step="0.5" data-dur="${i}" value="${el.duration || 0}">` : ''}
    ${(el.layers || []).map((l, j) => layerHtml(l, i, j)).join('')}
    <div class="add"><button data-addlayer="${i}">＋ Capa de texto</button></div></div>`;
}
function activeAt(el, t) {
  const ls = el.layers || []; let k = -1;
  ls.forEach((l, x) => { const s = l.start || 0, e = l.duration > 0 ? s + l.duration : Infinity; if (t >= s && t < e && (k < 0 || s >= (ls[k].start || 0))) k = x; });
  return k < 0 ? null : ls[k];
}
function renderPreview() {
  if (!$('#pvScreen') || !cur) return;
  const els = cur.elements;
  if (pv >= els.length) pv = els.length - 1;
  $('#pvChips').innerHTML = [['-1','Silueta'], ...els.map((e,i) => [String(i), String(i+1)])]
    .map(([v,l]) => `<button data-pv="${v}" class="${+v===pv?'on':''}">${l}</button>`).join('');
  document.querySelectorAll('#pvChips button').forEach(b => b.onclick = () => { pv = +b.dataset.pv; renderPreview(); });
  const el = pv >= 0 ? els[pv] : null;
  if (el && el.type !== 'text') {
    const ends = (el.layers || []).map(l => (l.start || 0) + (l.duration > 0 ? l.duration : 0));
    const max = Math.max(10, Math.ceil(Math.max(0, ...ends)) + 2);
    pvT = Math.min(pvT, max);
    $('#pvTime').innerHTML = `<input type="range" id="pvSlider" min="0" max="${max}" step="0.5" value="${pvT}" style="width:210px"><br><small style="text-align:center">segundo <b id="pvTl">${pvT}</b> de la escena</small>`;
    $('#pvSlider').oninput = e => { pvT = +e.target.value; $('#pvTl').textContent = pvT; drawScreen(); };
  } else $('#pvTime').innerHTML = '';
  drawScreen();
}
function panelHtml(tx, L, buttons) {
  return `<div class="pvpanel"><h2>${esc(tx.title)}</h2><div class="pvbody">${esc(tx.body) || '(vacío: no se muestra)'}</div><div class="pvrow">${buttons}</div></div>`;
}
function drawScreen() {
  const sc = $('#pvScreen'); if (!sc || !cur) return;
  const L = PV[tab] || PV.en, els = cur.elements;
  let h = '';
  if (pv < 0) {
    h = (cur.silhouetteSrc ? `<img src="${esc(cur.silhouetteSrc)}" alt="" style="position:absolute;left:15%;top:18%;width:70%;height:42%;object-fit:contain;filter:drop-shadow(0 0 6px #fff)">` : '')
      + `<div class="pvaim"><span>${L.aim}</span></div>`;
  } else {
    const el = els[pv], last = pv === els.length - 1;
    if (el.type === 'text') {
      let j = pv - 1; while (j >= 0 && els[j].type === 'text') j--;
      h = (j >= 0 ? media(els[j]) : '') + panelHtml((el.texts && el.texts[tab]) || {}, L,
        `<span class="pvb pvmore">${L.more}</span>${last ? '' : `<span class="pvb">${L.next}</span>`}<span class="pvb g">${L.close}</span>`);
    } else {
      h = media(el);
      if (el.type === 'image') h += `<span class="pvb pvfloat">${last ? L.close : L.next}</span>` + (el.audioSrc ? `<span class="pvb pvsound">🔇 ${L.mute}</span>` : '');
      const lay = activeAt(el, pvT);
      if (lay) h += panelHtml((lay.texts && lay.texts[tab]) || {}, L, `<span class="pvb pvmore">${L.more}</span>`);
    }
  }
  sc.innerHTML = h;
  const b = sc.querySelector('.pvbody'), m = sc.querySelector('.pvmore');
  if (b && m) m.style.display = b.scrollHeight > b.clientHeight + 1 ? '' : 'none';
}

// ---- QR para plantilla
async function genQR() {
  const out = $('#qrOut'); out.textContent = 'Generando…';
  const size = +$('#q_size').value || 40, bridge = (+$('#q_bridge').value || 30) / 100, ecc = $('#q_ecc').value;
  const url = `${location.origin}/?e=${cur.id}`;
  try {
    const r = await fetch(`/api/qr.svg?url=${encodeURIComponent(url)}&size=${size}&bridge=${bridge}&ecc=${ecc}`);
    if (!r.ok) throw new Error(await r.text());
    const svg = await r.text(), n = +r.headers.get('X-QR-Modules'), br = r.headers.get('X-QR-Bridges');
    const ok = r.headers.get('X-QR-Connected') === 'true';
    const blobUrl = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml' }));
    const html = `<div class="qrbox">${svg}</div>
      <p>${n}×${n} módulos · cada módulo mide <b>${(size/n).toFixed(2)} cm</b> · ${br} puentes de <b>${((size/n)*bridge*10).toFixed(1)} mm</b> ·
      ${ok ? '✓ todas las piezas de la plantilla quedan unidas' : '⚠ revisa: hay piezas sueltas'}</p>
      <p><a href="${blobUrl}" download="qr-${cur.id}.svg"><b>Descargar SVG</b></a><br><small>El trazado "corte" es la línea de corte (los huecos). Enlace codificado: ${esc(url)}</small></p>`;
    qrLast = { id: cur.id, html }; out.innerHTML = html;
  } catch (e) { out.textContent = 'Error: ' + e.message; }
}

function sync() {
  if (!$('#f_name')) return;
  cur.name = $('#f_name').value;
  cur.elements.forEach((el, i) => {
    const ti = document.querySelector(`[data-ti="${i}"]`), tb = document.querySelector(`[data-tb="${i}"]`);
    if (ti && tb) { el.texts = el.texts || {}; el.texts[tab] = { title: ti.value, body: tb.value }; }
    const dur = document.querySelector(`[data-dur="${i}"]`);
    if (dur) el.duration = Math.max(0, parseFloat(dur.value) || 0);
    (el.layers || []).forEach((l, j) => {
      const g = (a) => document.querySelector(`[data-${a}="${i}.${j}"]`);
      if (!g('ls')) return;
      l.start = Math.max(0, parseFloat(g('ls').value) || 0);
      l.duration = Math.max(0, parseFloat(g('ld').value) || 0);
      l.texts = l.texts || {};
      l.texts[tab] = { title: g('lt').value, body: g('lb').value };
    });
  });
}
async function save() {
  sync(); status('Guardando…');
  try {
    const opts = { headers:{'Content-Type':'application/json'}, body: JSON.stringify(cur) };
    const saved = cur.id ? await api('/api/experiences/' + cur.id, { method:'PUT', ...opts })
                         : await api('/api/experiences', { method:'POST', ...opts });
    await refresh(saved.id); status('✓ Guardado');
  } catch (e) { status('Error: ' + e.message); }
}
$('#btnNew').onclick = () => { cur = blank(); tab = 'es'; pv = 0; render(); };
refresh();
</script>
