<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="topbar"><select id="langSel" aria-label="Language"></select></div>

<!-- 1. Permiso de cámara -->
<section id="screenCamera" class="screen active">
  <div class="card">
    <div class="icon">📷</div>
    <h1 data-i="welcomeTitle"></h1>
    <p data-i="welcomeText"></p>
    <button id="btnCamera" class="btn" data-i="allowCamera"></button>
    <p id="camMsg" class="msg"></p>
  </div>
</section>

<!-- 3. Sticky o no -->
<section id="screenSticky" class="screen">
  <div class="card">
    <h1 data-i="stickyTitle"></h1>
    <button class="btn choice" data-sticky="1"><b data-i="stickyYes"></b><small data-i="stickyYesHint"></small></button>
    <button class="btn choice" data-sticky="0"><b data-i="stickyNo"></b><small data-i="stickyNoHint"></small></button>
  </div>
</section>

<!-- AR -->
<section id="screenAR" class="screen">
  <div id="sceneHolder"></div>
  <button id="btnX" class="x" aria-label="close">✕</button>
  <div id="silhouette"><img id="silImg" alt=""><p data-i="aim"></p></div>
  <div id="stage" class="hidden"></div>
  <button id="btnNextF" class="btn small hidden floatNext"></button>
  <div id="loading" data-i="loading"></div>
  <div id="textPanel" class="hidden">
    <h2 id="textTitle"></h2>
    <div id="textBody"></div>
    <div class="row">
      <button id="btnMore" class="btn small hidden" data-i="readMore"></button>
      <button id="btnNextP" class="btn small"></button>
      <button id="btnClose" class="btn small ghost" data-i="close"></button>
    </div>
  </div>
  <div id="modal" class="hidden">
    <div class="modalBox">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <button id="btnModalClose" class="btn" data-i="close"></button>
    </div>
  </div>
</section>

<!-- Final -->
<section id="screenEnd" class="screen">
  <div class="card">
    <h1 data-i="endTitle"></h1>
    <button id="btnRestart" class="btn" data-i="restart"></button>
  </div>
</section>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="app.js"></script>
</body>
</html>
